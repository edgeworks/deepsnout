name: deepsnout
x-app: &app
  build: .
  image: deepsnout:local
  environment: &environment
    DEEPSNOUT_DATA_DIR: /var/lib/deepsnout
    DEEPSNOUT_POSTGRES_HOST: db
    DEEPSNOUT_ALLOWED_HOSTS: ${DEEPSNOUT_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]},${DEEPSNOUT_PUBLIC_HOST:-localhost}
    DEEPSNOUT_SECURE_COOKIES: ${DEEPSNOUT_SECURE_COOKIES:-1}
    DEEPSNOUT_STORE_BUDGET_GIB: ${DEEPSNOUT_STORE_BUDGET_GIB:-4}
    DEEPSNOUT_STORE_RETENTION_DAYS: ${DEEPSNOUT_STORE_RETENTION_DAYS:-2}
  volumes:
    - app-secrets:/var/lib/deepsnout:ro
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  secrets:
    build: .
    image: deepsnout:local
    user: "0:0"
    command: [secrets]
    environment:
      DEEPSNOUT_DATA_DIR: /var/lib/deepsnout
      DEEPSNOUT_DB_SECRET_EXPORT: /export/password
      DEEPSNOUT_CHOWN_UID: "10001"
    volumes:
      - app-secrets:/var/lib/deepsnout
      - db-secret:/export
    read_only: true
    restart: "no"

  db:
    build:
      context: .
      dockerfile: deployment/postgres.Dockerfile
    image: deepsnout-postgres:local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: deepsnout
      POSTGRES_PASSWORD_FILE: /run/deepsnout-db/admin_password
    volumes:
      - database:/var/lib/postgresql/data
      - db-secret:/run/deepsnout-db:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, sh, /usr/local/bin/deepsnout-db-healthcheck]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  init:
    <<: *app
    command: [init]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  ingest-worker:
    <<: *app
    command: [ingest-worker]
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, deepsnout, worker-health, --role, ingest]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  analysis-worker:
    <<: *app
    command: [analysis-worker, --shards, "0,2"]
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, deepsnout, worker-health, --role, analysis, --shards, "0,2"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  analysis-worker-b:
    <<: *app
    command: [analysis-worker, --shards, "1,3"]
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, deepsnout, worker-health, --role, analysis, --shards, "1,3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  insight-worker:
    <<: *app
    command: [insight-worker]
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, deepsnout, worker-health, --role, insight]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: deployment/caddy.Dockerfile
    image: deepsnout-caddy:local
    environment:
      DEEPSNOUT_PUBLIC_HOST: ${DEEPSNOUT_PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  app-secrets:
  db-secret:
  database:
  caddy-data:
  caddy-config:
